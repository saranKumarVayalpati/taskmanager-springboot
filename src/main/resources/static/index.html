
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow - My Task Manager</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5fb;
            color: #20243a;
        }

        .container {
            max-width: 1050px;
            margin: 40px auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { color: #6558e8; }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            background: #6558e8;
            color: white;
            font-weight: bold;
        }

        button:hover { opacity: .85; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #0000000b;
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
        }

        #search { flex: 1; min-width: 180px; }

        .task {
            background: white;
            padding: 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            box-shadow: 0 3px 15px #0000000b;
        }

        .task p { color: #777; }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .TODO { background: #fff0cf; color: #9b6800; }
        .IN_PROGRESS { background: #e5ebff; color: #3656b5; }
        .COMPLETED { background: #d9f6e8; color: #16834c; }

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .delete { background: #e74c3c; }
        .edit { background: #536dfe; }

        .form {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .form.show { display: block; }

        .form input, .form textarea, .form select {
            display: block;
            width: 100%;
            margin: 10px 0;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            color: #777;
        }

        @media(max-width:600px) {
            .container { margin: 10px auto; padding: 12px; }
            .stats { gap: 8px; }
            .card { padding: 12px; }
            .card h2 { font-size: 22px; }
            .task { align-items: flex-start; }
            header { flex-wrap: wrap; }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <div>
            <h1>✓ TaskFlow</h1>
            <p>Plan your day. Track your progress.</p>
        </div>
        <button onclick="showForm()">+ Add Task</button>
    </header>

    <section class="stats">
        <div class="card">
            <span>Total Tasks</span>
            <h2 id="total">0</h2>
        </div>
        <div class="card">
            <span>In Progress</span>
            <h2 id="progress">0</h2>
        </div>
        <div class="card">
            <span>Completed</span>
            <h2 id="completed">0</h2>
        </div>
    </section>

    <section class="form" id="form">
        <h3 id="formTitle">Create New Task</h3>

        <input type="hidden" id="taskId">

        <input id="title" placeholder="Task title" required>
        <textarea id="description" placeholder="Description"></textarea>

        <select id="status">
            <option value="TODO">To Do</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
        </select>

        <button onclick="saveTask()">Save Task</button>
        <button onclick="hideForm()" style="background:#888">Cancel</button>
    </section>

    <div class="toolbar">
        <input id="search" placeholder="Search tasks..." oninput="render()">

        <select id="filter" onchange="render()">
            <option value="ALL">All Tasks</option>
            <option value="TODO">To Do</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
        </select>
    </div>

    <h3>My Tasks</h3>
    <div id="tasks"></div>

</div>

<script>
    const API = "/api/tasks";
    let tasks = [];

    async function api(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        if (!response.ok) {
            throw new Error("API error: " + response.status);
        }

        if (response.status === 204) return null;
        return response.json();
    }

    async function loadTasks() {
        try {
            tasks = await api(API);
            render();
        } catch (error) {
            document.getElementById("tasks").innerHTML =
                '<div class="empty">Unable to load tasks. Please refresh.</div>';
        }
    }

    function render() {
        const filter = document.getElementById("filter").value;
        const search = document.getElementById("search").value.toLowerCase();

        document.getElementById("total").textContent = tasks.length;

        document.getElementById("progress").textContent =
            tasks.filter(t => t.status === "IN_PROGRESS").length;

        document.getElementById("completed").textContent =
            tasks.filter(t => t.status === "COMPLETED").length;

        const filtered = tasks.filter(t =>
            (filter === "ALL" || t.status === filter) &&
            (t.title + " " + (t.description || ""))
                .toLowerCase().includes(search)
        );

        const container = document.getElementById("tasks");

        if (!filtered.length) {
            container.innerHTML =
                '<div class="empty">No tasks found. Add your first task!</div>';
            return;
        }

        container.innerHTML = filtered.map(t => `
            <div class="task">
                <div>
                    <h3>${escapeHtml(t.title)}</h3>
                    <p>${escapeHtml(t.description || "No description")}</p>
                    <span class="status ${t.status}">
                        ${t.status.replace("_", " ")}
                    </span>
                    <div class="actions">
                        <button class="edit" onclick="editTask(${t.id})">Edit</button>
                        <button class="delete" onclick="deleteTask(${t.id})">Delete</button>
                    </div>
                </div>
            </div>
        `).join("");
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[c]);
    }

    function showForm() {
        document.getElementById("form").classList.add("show");
        document.getElementById("formTitle").textContent = "Create New Task";
        document.getElementById("taskId").value = "";
        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("status").value = "TODO";
    }

    function hideForm() {
        document.getElementById("form").classList.remove("show");
    }

    function editTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        showForm();

        document.getElementById("formTitle").textContent = "Update Task";
        document.getElementById("taskId").value = task.id;
        document.getElementById("title").value = task.title;
        document.getElementById("description").value = task.description || "";
        document.getElementById("status").value = task.status;
    }

    async function saveTask() {
        const id = document.getElementById("taskId").value;

        const task = {
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            status: document.getElementById("status").value
        };

        if (!task.title) {
            alert("Please enter task title");
            return;
        }

        try {
            await api(id ? API + "/" + id : API, {
                method: id ? "PUT" : "POST",
                body: JSON.stringify(task)
            });

            hideForm();
            await loadTasks();
        } catch (error) {
            alert("Unable to save task: " + error.message);
        }
    }

    async function deleteTask(id) {
        if (!confirm("Are you sure you want to delete this task?")) return;

        try {
            await api(API + "/" + id, { method: "DELETE" });
            await loadTasks();
        } catch (error) {
            alert("Unable to delete task: " + error.message);
        }
    }

    loadTasks();
</script>
</body>
</html>
